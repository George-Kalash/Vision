<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Vision Income Statement Sandbox</title>
      <style>
        :root {
          font-family: "Inter", "Segoe UI", sans-serif;
          color: #0a0a0a;
          background-color: #f5f3ef;
        }

        body {
          margin: 0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #f5f3ef;
          color: #0a0a0a;
        }

        main {
          width: min(960px, 94vw);
          background: #fffdf7;
          border: 4px solid #0a0a0a;
          border-radius: 20px;
          padding: 44px;
          box-shadow: 12px 12px 0 #0a0a0a;
        }

        h1 {
          margin: 0 0 16px;
          font-size: 2.4rem;
          font-weight: 800;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }

        p.lead {
          margin: 0 0 32px;
          color: #343434;
          font-size: 1rem;
          max-width: 56ch;
        }

        form {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
          gap: 20px;
          align-items: end;
          margin-bottom: 30px;
        }

        label {
          display: block;
          font-size: 0.78rem;
          font-weight: 700;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          margin-bottom: 9px;
        }

        input::-webkit-outer-spin-button,
          input::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }

        input {
          width:90%;
          padding: 13px 16px;
          border-radius: 14px;
          border: 3px solid #0a0a0a;
          background: #f0eee5;
          color: inherit;
          text-transform: uppercase;
          font-size: 1rem;
          box-shadow: 5px 5px 0 #0a0a0a;
          transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
          outline: none;
          transform: translate(-2px, -2px);
          box-shadow: 7px 7px 0 #0a0a0a;
          background: #ffffff;
        }

        button {
          background: #ff6b4a;
          border: 3px solid #0a0a0a;
          color: #0a0a0a;
          font-weight: 800;
          padding: 13px 22px;
          border-radius: 16px;
          cursor: pointer;
          box-shadow: 7px 7px 0 #0a0a0a;
          transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        button:disabled {
          background: #d6d6d6;
          color: #6b6b6b;
          cursor: wait;
          box-shadow: 5px 5px 0 #0a0a0a;
        }

        button:hover:not(:disabled) {
          transform: translate(-3px, -3px);
          box-shadow: 11px 11px 0 #0a0a0a;
        }

        section#results {
          display: none;
        }

        section#results.active {
          display: block;
        }

        .meta {
          display: flex;
          flex-wrap: wrap;
          align-items: baseline;
          gap: 20px;
          margin-bottom: 20px;
        }

        .meta h2 {
          margin: 0;
          font-size: 1.7rem;
          font-weight: 800;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }

        .meta span {
          font-size: 1rem;
          color: #2f2f2f;
          font-weight: 600;
        }

        .tag {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: #89ffa4;
          border: 3px solid #0a0a0a;
          color: #0a0a0a;
          padding: 6px 14px;
          border-radius: 999px;
          font-size: 0.82rem;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          box-shadow: 5px 5px 0 #0a0a0a;
        }

        .note {
          margin: 0 0 14px;
          font-size: 0.88rem;
          color: #d7263d;
          font-weight: 700;
        }

        .table-wrap {
          overflow-x: auto;
          border-radius: 20px;
          border: 4px solid #0a0a0a;
          background: #faf7ef;
          max-height: 480px;
          overflow-y: auto;
          box-shadow: 12px 12px 0 #0a0a0a;
        }

        table {
          width: 100%;
          border-collapse: separate;
          border-spacing: 0;
          white-space: nowrap;
        }

        thead th {
          position: sticky;
          top: 0;
          background: #323037;
          text-align: left;
          padding: 15px 20px;
          color: white;
          font-size: 0.84rem;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          border-bottom: 3px solid #0a0a0a;
          border-right: 2px solid #000;
        }

        tbody td {
          padding: 12px 20px;
          border-bottom: 2px solid #0a0a0a;
          border-right: 2px solid #0a0a0a;
          font-size: 0.97rem;
          background: #fffdf7;
        }

        tbody tr:nth-child(even) td {
          background: #f5f0e4;
        }

        tbody tr td:first-child {
          border-left: 2px solid #0a0a0a;
        }

        .empty {
          color: #6f6f6f;
          font-style: italic;
        }
      </style>
    </head>
    <body>
      <main>
        <h1>Vision Income Statement Sandbox</h1>
        <p class="lead">Drop in any US equity ticker to preview a normalized income statement generated by the Vision pipeline. Up to 10 years of annual filings, pulled straight from EDGAR.</p>
        <form id="statement-form">
          <div>
            <label for="ticker">Ticker</label>
            <input id="ticker" name="ticker" autocomplete="off" placeholder="AAPL" minlength="1" maxlength="10" required>
          </div>
          <div>
            <label for="years">Years (1-10)</label>
            <input id="years" name="years" type="number" min="1" max="10" value="10">
          </div>
          <div>
            <button type="submit">Fetch Statement</button>
          </div>
        </form>
        <section id="results">
          <div class="meta">
            <h2 id="company-title"></h2>
            <span id="normalization-flag" class="tag" hidden>Normalized</span>
            <span id="price-flag"></span>
          </div>
          <p id="note" class="note" hidden style="display: none"></p>
          <div class="table-wrap">
            <table id="result-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
      <script>
        const form = document.getElementById("statement-form");
        const results = document.getElementById("results");
        const title = document.getElementById("company-title");
        const normalizationFlag = document.getElementById("normalization-flag");
        const priceFlag = document.getElementById("price-flag");
        const note = document.getElementById("note");
        const tableHead = document.querySelector("#result-table thead");
        const tableBody = document.querySelector("#result-table tbody");
        const submitBtn = form.querySelector("button[type='submit']");

        function resetView() {
          results.classList.remove("active");
          title.textContent = "";
          normalizationFlag.hidden = true;
          priceFlag.textContent = "";
          note.hidden = true;
          note.textContent = "";
          tableHead.innerHTML = "";
          tableBody.innerHTML = "";
        }

        function renderTable(columns, rows) {
          tableHead.innerHTML = "";
          tableBody.innerHTML = "";
          const filteredColumns = columns.filter((col) => col.toLowerCase() !== "concept");
          if (!filteredColumns.length || !rows.length) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.textContent = "No rows returned.";
            cell.colSpan = filteredColumns.length || 1;
            cell.classList.add("empty");
            row.appendChild(cell);
            tableBody.appendChild(row);
            return;
          }
          const headerRow = document.createElement("tr");
          filteredColumns.forEach((col) => {
            const th = document.createElement("th");
            th.textContent = col;
            headerRow.appendChild(th);
          });
          tableHead.appendChild(headerRow);
          rows.forEach((row) => {
            const tr = document.createElement("tr");
            filteredColumns.forEach((col) => {
              const td = document.createElement("td");
              const value = row[col];
              if (value === null || value === undefined || value === "") {
                td.textContent = "--";
                td.classList.add("empty");
              } else {
                td.textContent = typeof value === "number" ? value.toLocaleString() : value;
              }
              tr.appendChild(td);
            });
            tableBody.appendChild(tr);
          });
        }

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          resetView();
          const ticker = form.ticker.value.trim().toUpperCase();
          let years = parseInt(form.years.value, 10);
          if (Number.isNaN(years)) years = 10;
          years = Math.min(Math.max(years, 1), 10);
          submitBtn.disabled = true;
          try {
            const response = await fetch("/api/income-statement", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ ticker, years })
            });
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || "Unexpected error");
            }
            title.textContent = `${data.company.name} (${data.company.ticker})`;
            if (Number.isFinite(data.company.latestPrice)) {
              priceFlag.textContent = `Last price: $${Number(data.company.latestPrice).toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
            } else {
              priceFlag.textContent = "";
            }
            normalizationFlag.hidden = !data.normalized;
            renderTable(data.columns, data.rows);
            if (data.note) {
              note.hidden = false;
              note.textContent = `Normalization fallback: ${data.note}`;
            }
            results.classList.add("active");
          } catch (error) {
            console.error(error);
          } finally {
            submitBtn.disabled = false;
          }
        });
      </script>
    </body>
    </html>
